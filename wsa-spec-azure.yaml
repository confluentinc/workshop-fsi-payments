# WSA Spec — Azure (RiverPay instructor-led Elevate)
# Usage: op run --env-file=.env.tpl -- wsa build -w workshop-fsi-payments/wsa-spec-azure.yaml
# Operator guide: docs/operator-azure-elevate.md
# Patterned on workshop-tableflow-databricks/wsa-spec-azure.yaml

name: riverpay-fsi-payments-azure
description: Confluent Cloud + Flink + Tableflow + Databricks — RiverPay Elevate (Azure)
cloud: Azure

# Dry-run friendly default; raise for the real event (e.g. 40–95).
account_count: 2

email_pattern: "tmm+wp{N}@confluent.io"

# terraform_repo: https://github.com/confluentinc/workshop-fsi-payments
terraform_path: terraform/azure/
# terraform_ref: main
shared_infra_path: terraform/azure-shared/

# Local-copy mode only stages terraform/ by default. Azure-shared + per-attendee
# resolve ../../services, ../../shadowtraffic, and the UDF JAR — stage them.
stage_paths:
  - services/risk-api/
  - shadowtraffic/
  - udf/riverpay-risk/dist/

# ShadowTraffic: azure-shared deploys profiles+FX → shared Postgres; after accounts,
# scripts/wsa-deploy-lifecycle-st.sh applies azure-lifecycle-st (one multi-Kafka ST).

monitoring:
  enabled: true

cleanup:
  # Instructor-led attendees enable Tableflow themselves; still disable any
  # leftover topics before destroy to avoid provider-integration 409s.
  disable_tableflow: true

isolation:
  databricks:
    model: shared-workspace
    workspace_name: "workshop-riverpay" # change if your shared workspace name differs
    workspace_create: false
    folder: per-user

terraform_vars:
  confluent_cloud_email: "{email}"
  account_email: "{email}"
  databricks_user_email: "{email}"
  databricks_sso_email: "wp{N}@tmmconfluentgmail.onmicrosoft.com"
  environment: "workshop"
  prefix: "wp{NNN}"
  table_include_list: "riverpay.customer_profiles,riverpay.fx_rates"
  enable_flink_mts: false
  enable_tableflow_topics: false
  enable_risk_udf: true
  enable_lifecycle_shadowtraffic: false
  risk_udf_jar_path: "../../udf/riverpay-risk/dist/riverpay-risk-udf-1.0.0.jar"
  # Shared Risk API / Postgres SSH / storage are injected from azure-shared
  # outputs as TF_VAR_shared_* (see docs/operator-azure-elevate.md).

providers:
  - name: confluent
    version: ">= 2.0"
  - name: databricks
    version: ">= 1.0"
  - name: azurerm
    version: ">= 3.0"

tools_required:
  - name: terraform
    version: ">= 1.7"
  - name: git
    version: ">= 2.0"
  - name: op
    version: ">= 2.0"
  - name: az
    version: ">= 2.50"

env_vars:
  - TF_VAR_confluent_cloud_api_key
  - TF_VAR_confluent_cloud_api_secret
  - TF_VAR_databricks_azure_host
  - TF_VAR_databricks_azure_service_principal_client_id
  - TF_VAR_databricks_azure_service_principal_client_secret
  - TF_VAR_owner_email
  - ARM_TENANT_ID
  - ARM_CLIENT_ID
  - ARM_CLIENT_SECRET
  - ARM_SUBSCRIPTION_ID

credentials:
  - name: Confluent Cloud
    fields:
      - label: URL
        source: terraform
        output: cc_environment_url
      - label: Username
        source: spec
        value: "{email}"
      - label: Password
        source: op
  - name: Databricks
    fields:
      - label: Workspace URL
        source: terraform
        output: dbx_workspace_url
      - label: Username
        source: spec
        value: "wp{N}@tmmconfluentgmail.onmicrosoft.com"
      - label: Password
        source: op
      - label: SP Client ID
        source: terraform
        output: dbx_sp_client_id
      - label: SP Client Secret
        source: terraform
        output: dbx_sp_client_secret
      - label: Unity Catalog Name
        source: terraform
        output: dbx_catalog_name
      - label: Storage Account Name
        source: terraform
        output: storage_account_name
      - label: Storage Container Name
        source: terraform
        output: storage_container_name
      - label: Schema Name
        source: terraform
        output: dbx_schema_name
      - label: SQL Warehouse ID
        source: terraform
        output: dbx_sql_warehouse_id
