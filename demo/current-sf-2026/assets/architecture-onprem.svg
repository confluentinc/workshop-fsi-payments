<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="aTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/></marker>
    <marker id="aGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/></marker>
  </defs>

  <!-- title + legend -->
  <text x="24" y="26" font-size="17" font-weight="bold" fill="#0f172a">Video 3 — On-prem AI (CP Flink): sovereign inference + NL self-service</text>
  <text x="976" y="532" font-size="11" fill="#475569" text-anchor="end">Solid = data flow &#183; Dashed = ops enablement / BYO LLM &#183; nothing leaves the perimeter except the optional BYO-LLM prompt</text>

  <!-- perimeter -->
  <rect x="24" y="44" width="772" height="468" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="410" y="64" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">RiverPay perimeter — on-prem (data + model never leave)</text>

  <!-- outside boundary -->
  <rect x="812" y="392" width="176" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="900" y="384" font-size="11" fill="#64748b" text-anchor="middle">Outside the boundary (optional)</text>

  <!-- nodes -->
  <!-- Sam -->
  <rect x="60" y="74" width="150" height="46" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="135" y="101" font-size="13" fill="#0f172a" text-anchor="middle">Sam — Flink ops</text>
  <!-- Streams -->
  <rect x="60" y="172" width="176" height="60" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="148" y="197" font-size="13" fill="#0f172a" text-anchor="middle">CP Kafka</text>
  <text x="148" y="214" font-size="13" fill="#0f172a" text-anchor="middle">RiverFlow streams</text>
  <!-- Flink -->
  <rect x="336" y="172" width="176" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="424" y="197" font-size="13" fill="#0f172a" text-anchor="middle">CP Flink pipeline</text>
  <text x="424" y="214" font-size="13" fill="#0f172a" text-anchor="middle">(via CMF)</text>
  <!-- Model -->
  <rect x="600" y="120" width="184" height="60" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="692" y="145" font-size="13" fill="#0f172a" text-anchor="middle">KServe — IBM Granite</text>
  <text x="692" y="162" font-size="13" fill="#0f172a" text-anchor="middle">model (CI, on-prem)</text>
  <!-- RiverPulse -->
  <rect x="600" y="260" width="184" height="60" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="692" y="285" font-size="13" fill="#0f172a" text-anchor="middle">RiverPulse</text>
  <text x="692" y="302" font-size="13" fill="#0f172a" text-anchor="middle">scored exceptions</text>
  <!-- Dana -->
  <rect x="60" y="408" width="150" height="50" rx="10" fill="#eef2ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="135" y="430" font-size="13" fill="#0f172a" text-anchor="middle">Dana — VP</text>
  <text x="135" y="447" font-size="13" fill="#0f172a" text-anchor="middle">Payment Ops</text>
  <!-- Assistant -->
  <rect x="312" y="404" width="224" height="58" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="424" y="429" font-size="13" fill="#0f172a" text-anchor="middle">Confluent Assistant</text>
  <text x="424" y="446" font-size="12" fill="#475569" text-anchor="middle">(UI: SQL Chatbook &#183; Preview)</text>
  <!-- BYO LLM -->
  <rect x="820" y="404" width="160" height="60" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="900" y="429" font-size="13" fill="#0f172a" text-anchor="middle">BYO LLM</text>
  <text x="900" y="446" font-size="12" fill="#475569" text-anchor="middle">(customer's choice)</text>

  <!-- INFERENCE flow (blue) -->
  <path d="M236,202 L330,202" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <path d="M512,190 L596,158" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="556" y="168" font-size="11" fill="#2563eb" text-anchor="middle">AI_FORECAST / anomaly</text>
  <path d="M512,214 L596,284" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="548" y="262" font-size="11" fill="#2563eb" text-anchor="middle">writes</text>

  <!-- NL flow (teal) -->
  <path d="M210,433 L306,433" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#aTeal)"/>
  <path d="M424,404 L424,238" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="432" y="322" font-size="11" fill="#0d9488" text-anchor="start">drafts &amp; runs SQL</text>
  <path d="M536,420 L596,304" fill="none" stroke="#0d9488" stroke-width="2" marker-end="url(#aTeal)"/>
  <text x="556" y="360" font-size="11" fill="#0d9488" text-anchor="middle">reads results</text>
  <path d="M536,433 L814,433" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <text x="672" y="425" font-size="11" fill="#0d9488" text-anchor="middle">prompt only (BYO)</text>

  <!-- ENABLE flows (gray dashed) -->
  <path d="M210,88 L692,88 L692,116" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="440" y="80" font-size="11" fill="#6b7280" text-anchor="middle">register model + RBAC</text>
  <path d="M60,97 L42,97 L42,486 L424,486 L424,466" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text x="236" y="500" font-size="11" fill="#6b7280" text-anchor="middle">create env &#183; connect BYO LLM &#183; topics &#183; RBAC</text>
</svg>
