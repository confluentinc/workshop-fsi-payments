# WSA Spec — AWS (RiverPay instructor-led)
# Usage: op run --env-file=.env.tpl -- wsa build -w workshop-fsi-payments/wsa-spec-aws.yaml
# Operator guide: docs/operator-instructor-led.md
# Patterned on wsa-spec-azure.yaml + terraform/aws-shared

# wsa release this spec requires. Required — the spec fails to load without it,
# and wsa refuses to build/validate on a binary outside the range. Caret on a
# 0.x floor resolves to >=0.3.0 <0.4.0: pre-1.0, every minor may break, so this
# caps at the next minor. Bump when the spec adopts a newer wsa feature.
wsa_version: "^0.3.0"

name: riverpay-fsi-payments-aws
description: Confluent Cloud + Flink + Tableflow + Databricks — RiverPay instructor-led (AWS)
cloud: AWS

# Dry-run friendly default; raise for the real event (e.g. 40–95).
#
# GOTCHA: this is also the fallback `wsa build` uses when `--accounts` is
# omitted — including on a `--phases X`-only re-run of an *existing* run-id.
# It does NOT read build-report.json to see how many accounts that run
# actually built. Re-running `lifecycle-st` (below) without repeating the
# same `--accounts` your real build used will silently apply against just
# these 2 accounts instead of the full set — see the "Re-running a single
# build phase" note in docs/operator-instructor-led.md.
account_count: 2

# email_pattern moved to operator config: set WSA_EMAIL_PATTERN in wsa.env
# (e.g. WSA_EMAIL_PATTERN=tmm+wp{N}@confluent.io). {email}/{N} tokens below
# resolve through it.

# terraform_repo: https://github.com/confluentinc/workshop-fsi-payments
# terraform_ref: main
phases:
  - name: shared
    scope: once
    path: terraform/aws-shared/

  - name: accounts
    scope: per_account
    path: terraform/aws/

  # Post-account aggregator: one multi-Kafka lifecycle ShadowTraffic deploy that
  # needs an output from every account. Off by default; run with --phases lifecycle-st
  # (auto-runs only when all accounts in the run have built). Replaces the old
  # scripts/wsa-deploy-lifecycle-st.sh.
  #
  # IMPORTANT: when running this phase on its own against an existing run-id,
  # pass --accounts matching the accounts that run actually built. Without it,
  # this falls back to account_count above (2), not the real build — see the
  # GOTCHA note there.
  - name: lifecycle-st
    scope: once
    path: terraform/aws-lifecycle-st/
    enabled: false                                 # off by default; --phases lifecycle-st to run
    on_failure: warn                               # a failed aggregator must not fail the build
    # No enabled_var: the account module always emits lifecycle_st_cluster, and its
    # enable_lifecycle_shadowtraffic flag gates a *per-attendee* debug container
    # (st-life-*), which instructor-led keeps off. See docs/operator-instructor-led.md.
    vars_from:
      - { phase: shared,   output: postgres_public_ip,            as: ssh_host }
      - { phase: shared,   output: postgres_ssh_username,         as: ssh_user }
      - { phase: shared,   output: postgres_ssh_private_key_path, as: ssh_private_key_path }
      - { phase: accounts, output: lifecycle_st_cluster,          as: clusters }

# Local-copy mode only stages terraform/ by default. Shared + per-attendee
# resolve ../../services, ../../shadowtraffic, and the UDF JAR — stage them.
stage_paths:
  - services/risk-api/
  - shadowtraffic/
  - udf/riverpay-risk/dist/

# ShadowTraffic: aws-shared deploys profiles+FX → shared Postgres; the
# lifecycle-st phase applies aws-lifecycle-st (one multi-Kafka ST) after accounts.

monitoring:
  enabled: true

cleanup:
  disable_tableflow: true

isolation:
  databricks:
    model: shared-workspace
    workspace_name: "workshop-riverpay"
    workspace_create: false
    folder: per-user

terraform_vars:
  confluent_cloud_email: "{email}"
  databricks_user_email: "{email}"
  databricks_sso_email: "{email}"
  environment: "workshop"
  prefix: "wp{NNN}"
  table_include_list: "riverpay.customer_profiles,riverpay.fx_rates"
  enable_flink_mts: false
  enable_tableflow_topics: false
  enable_risk_udf: true
  # Gates the optional per-attendee debug ST container (st-life-*); instructor-led
  # keeps this off and uses the lifecycle-st phase (one multi-Kafka container) instead.
  enable_lifecycle_shadowtraffic: false
  enable_shadowtraffic: false
  enable_risk_api: false
  risk_udf_jar_path: "../../udf/riverpay-risk/dist/riverpay-risk-udf-1.0.0.jar"
  # Shared Postgres / S3 / Risk API / SSH are injected from aws-shared
  # outputs as TF_VAR_shared_* (see docs/operator-instructor-led.md).

providers:
  - name: confluent
    version: ">= 2.0"
  - name: databricks
    version: ">= 1.0"
  - name: aws
    version: ">= 5.0"

tools_required:
  - name: terraform
    version: ">= 1.7"
  - name: git
    version: ">= 2.0"
  - name: op
    version: ">= 2.0"
  - name: aws
    version: ">= 2.0"

env_vars:
  - TF_VAR_confluent_cloud_api_key
  - TF_VAR_confluent_cloud_api_secret
  - TF_VAR_databricks_aws_host
  - TF_VAR_databricks_aws_account_id
  - TF_VAR_databricks_aws_service_principal_client_id
  - TF_VAR_databricks_aws_service_principal_client_secret
  - TF_VAR_owner_email
  - TF_VAR_aws_access_key_id
  - TF_VAR_aws_secret_access_key
  - TF_VAR_aws_cloud_region
  - AWS_ACCESS_KEY_ID
  - AWS_SECRET_ACCESS_KEY

credentials:
  - name: Confluent Cloud
    fields:
      - label: URL
        source: terraform
        output: cc_environment_url
      - label: Username
        source: spec
        value: "{email}"
      - label: Password
        source: op
  - name: Databricks
    fields:
      - label: Workspace URL
        source: terraform
        output: dbx_workspace_url
      - label: Username
        source: spec
        value: "{email}"
      - label: Password
        source: op
      - label: SP Client ID
        source: terraform
        output: dbx_sp_client_id
      - label: SP Client Secret
        source: terraform
        output: dbx_sp_client_secret
      - label: Unity Catalog Name
        source: terraform
        output: dbx_catalog_name
      - label: Schema Name
        source: terraform
        output: dbx_schema_name
      - label: SQL Warehouse ID
        source: terraform
        output: dbx_sql_warehouse_id
